<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8fc"><title>おトク発見ナビ｜導入管理</title><link rel="stylesheet" href="css/language.css"></head>
<body>
<header class="topbar"><a class="brand" href="./">おトク発見ナビ <span>INSTALL</span></a><label class="language-control"><span data-i18n="language.label">表示言語</span><select id="languageSelect" aria-label="表示言語"><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option></select></label></header>
<main class="shell"><section id="welcomePanel" class="welcome"><div class="eyebrow" data-i18n="welcome.eyebrow">INSTALLATION CENTER</div><h1 data-i18n="welcome.title">導入管理画面へようこそ</h1><p data-i18n="welcome.description">画面の案内に沿って、おトク発見ナビの初期導入と設定を進められます。</p><div class="notice"><h2 data-i18n="welcome.prepareTitle">導入ウィザード</h2><p data-i18n="welcome.prepareDescription">10段階の案内に沿って設定できます。途中で保存して、あとから再開できます。</p></div><button id="startButton" class="primary" data-i18n="actions.start">導入を開始する</button><p id="resumeHint" class="muted" hidden data-i18n="wizard.resumeHint">保存済みの進捗があります。続きから再開できます。</p></section>
<section id="wizardPanel" hidden><div class="wizard-head"><div><div class="eyebrow" data-i18n="wizard.eyebrow">INSTALLATION WIZARD</div><h1 data-i18n="wizard.title">初期導入</h1></div><button id="saveButton" class="secondary" data-i18n="actions.save">進捗を保存</button></div><div class="progress-line"><span id="progressFill"></span></div><div class="step-meta"><span id="stepCounter"></span><span id="stepPercent"></span></div><div class="wizard-grid"><nav id="stepNav" class="step-nav" aria-label="導入ステップ"></nav><article class="step-card"><h2 id="stepTitle"></h2><p id="stepDescription" class="muted"></p><div id="stepContent"></div><p id="saveStatus" class="status" aria-live="polite"></p><div class="actions"><button id="backButton" class="secondary" data-i18n="actions.back">戻る</button><button id="nextButton" class="primary" data-i18n="actions.next">次へ</button></div></article></div></section>
</main><footer data-i18n="footer.note">言語設定と導入の進捗は、このブラウザ内に保存されます。</footer><script src="js/language.js" defer></script><script src="js/wizard.js" defer></script></body></html>
